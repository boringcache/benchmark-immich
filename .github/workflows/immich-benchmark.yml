name: "Immich Benchmark"
run-name: >-
  ${{ format('Benchmark {0} | {1}', github.event_name == 'pull_request' && 'Validation' || 'Rolling', github.event_name == 'push' && 'Upstream update' || github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || format('Manual dispatch ({0})', github.ref_name)) }}
on:
  workflow_dispatch:
    inputs:
      buildkit_image:
        description: "Optional managed BoringCache BuildKit image for canary runs."
        required: false
        type: string
        default: ""
      cli_version:
        description: "Optional BoringCache CLI release tag for canary runs, for example vcli-canary."
        required: false
        type: string
        default: ""
      benchmark_id_suffix:
        description: "Optional suffix appended to built-in benchmark/cache scopes for isolated comparison runs."
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths:
      - ".gitmodules"
      - "upstream"
  pull_request:
    paths:
      - ".gitmodules"
      - ".github/workflows/immich-benchmark.yml"
      - ".github/workflows/immich-fresh-benchmark.yml"
      - ".github/workflows/reusable-immich-docker-benchmark.yml"
      - "README.md"
      - "scenarios/**"
      - "scripts/**"
      - "upstream"
      - "libjxl-patches/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  packages: read

jobs:
  github-actions-cache:
    name: GHA
    uses: ./.github/workflows/reusable-immich-docker-benchmark.yml
    with:
      strategy: actions-cache
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      benchmark_id: ${{ format('immich{0}', inputs.benchmark_id_suffix) }}
    secrets: inherit

  boringcache:
    name: BC
    uses: ./.github/workflows/reusable-immich-docker-benchmark.yml
    with:
      strategy: boringcache
      cache_lane: ${{ github.event_name == 'pull_request' && 'fresh' || 'rolling' }}
      benchmark_id: ${{ format('immich{0}', inputs.benchmark_id_suffix) }}
      cli_version: ${{ inputs.cli_version }}
      buildkit_image: ${{ inputs.buildkit_image }}
    secrets: inherit
