name: "Run Immich base-images benchmark phase"
description: "Builds one pinned Immich base-server-dev source revision with one cache provider."
inputs:
  strategy: {required: true}
  phase: {required: true}
  source_sha: {required: true}
  benchmark_id: {required: true}
runs:
  using: composite
  steps:
    - name: Start the workflow timer
      id: workflow_timer
      shell: bash
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Checkout pinned Immich base-images source
      uses: actions/checkout@v6
      with:
        repository: immich-app/base-images
        ref: ${{ inputs.source_sha }}
        path: base-images-upstream
        persist-credentials: false

    - name: Verify the immutable source
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source_sha }}
      run: |
        set -euo pipefail
        [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full commit SHA" >&2; exit 1; }
        actual_sha="$(git -C base-images-upstream rev-parse HEAD)"
        [[ "$actual_sha" == "$SOURCE_SHA" ]] || { echo "Expected $SOURCE_SHA, checked out $actual_sha" >&2; exit 1; }

    - name: Prepare the benchmark cache profile
      shell: bash
      env:
        CACHE_PROFILE: ${{ inputs.strategy == 'boringcache-ccache' && 'ccache' || 'baseline' }}
      run: python3 ./scripts/prepare-immich-base-images-source.py "$CACHE_PROFILE" base-images-upstream

    - name: Stage the CLI-compatible ccache binary
      if: inputs.strategy == 'boringcache-ccache'
      shell: bash
      run: ./scripts/stage-ccache-binary.sh base-images-upstream/server/ccache

    - name: Select the isolated cache cohort
      id: scope
      shell: bash
      env:
        BENCHMARK_ID: ${{ inputs.benchmark_id }}
        STRATEGY: ${{ inputs.strategy }}
      run: |
        set -euo pipefail
        cache_scope="${BENCHMARK_ID}-r${GITHUB_RUN_ID}-a${GITHUB_RUN_ATTEMPT}-${STRATEGY}"
        if [[ "$STRATEGY" == boringcache* ]]; then
          ./scripts/scope-boringcache-run.sh "$cache_scope"
        fi
        echo "cache_scope=${cache_scope}" >> "$GITHUB_OUTPUT"
        echo "source_sha=$(git -C base-images-upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Start the provider setup timer
      id: setup_timer
      shell: bash
      run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Set up Buildx for the GitHub Actions comparison
      if: inputs.strategy == 'actions-cache'
      uses: docker/setup-buildx-action@v4

    - name: Start the build timer
      id: build_timer
      shell: bash
      env:
        SETUP_STARTED_AT: ${{ steps.setup_timer.outputs.started_at }}
      run: |
        set -euo pipefail
        now="$(date +%s)"
        echo "setup_seconds=$(( now - SETUP_STARTED_AT ))" >> "$GITHUB_OUTPUT"
        echo "started_at=${now}" >> "$GITHUB_OUTPUT"

    - name: Build with the GitHub Actions cache
      if: inputs.strategy == 'actions-cache'
      uses: docker/build-push-action@v6
      env:
        DOCKER_BUILD_SUMMARY: "false"
        DOCKER_BUILD_RECORD_UPLOAD: "false"
      with:
        context: base-images-upstream/server
        file: base-images-upstream/server/Dockerfile
        platforms: linux/amd64
        target: dev
        push: false
        cache-from: ${{ inputs.phase == 'rebuild' && format('type=gha,scope={0}', steps.scope.outputs.cache_scope) || '' }}
        cache-to: ${{ inputs.phase == 'seed' && format('type=gha,scope={0},mode=max', steps.scope.outputs.cache_scope) || '' }}

    - name: Publish the BoringCache seed
      id: publish
      if: startsWith(inputs.strategy, 'boringcache') && inputs.phase == 'seed'
      uses: boringcache/one@e24257b122813ad11d53b9ed024b474ca4946ad2 # v1 / 1.19.1
      with:
        setup: none
        mode: docker
        trust-policy: publish
        context: base-images-upstream/server
        dockerfile: base-images-upstream/server/Dockerfile
        image: immich-base-server-dev-benchmark
        tags: ${{ inputs.strategy }}
        target: dev
        platforms: linux/amd64
        push: false
        load: false
        docker-tool-cache: ${{ inputs.strategy == 'boringcache-ccache' && 'ccache' || '' }}
        fail-on-cache-error: true
        metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=seed,variant=${{ inputs.strategy }}

    - name: Restore the BoringCache rebuild
      id: restore
      if: startsWith(inputs.strategy, 'boringcache') && inputs.phase == 'rebuild'
      uses: boringcache/one@e24257b122813ad11d53b9ed024b474ca4946ad2 # v1 / 1.19.1
      with:
        setup: none
        mode: docker
        trust-policy: restore
        context: base-images-upstream/server
        dockerfile: base-images-upstream/server/Dockerfile
        image: immich-base-server-dev-benchmark
        tags: ${{ inputs.strategy }}
        target: dev
        platforms: linux/amd64
        push: false
        load: false
        docker-tool-cache: ${{ inputs.strategy == 'boringcache-ccache' && 'ccache' || '' }}
        fail-on-cache-error: true
        metadata-hints: benchmark=${{ inputs.benchmark_id }},phase=rebuild,variant=${{ inputs.strategy }}

    - name: Capture the build timing
      id: build_timing
      shell: bash
      env:
        BUILD_STARTED_AT: ${{ steps.build_timer.outputs.started_at }}
      run: echo "build_seconds=$(( $(date +%s) - BUILD_STARTED_AT ))" >> "$GITHUB_OUTPUT"

    - name: Write the benchmark phase evidence
      shell: bash
      env:
        BENCHMARK_ID: ${{ inputs.benchmark_id }}
        STRATEGY: ${{ inputs.strategy }}
        REPORT_PHASE: ${{ inputs.phase == 'seed' && 'cold' || 'warm' }}
        WORKFLOW_STARTED_AT: ${{ steps.workflow_timer.outputs.started_at }}
        SETUP_SECONDS: ${{ steps.build_timer.outputs.setup_seconds }}
        BUILD_SECONDS: ${{ steps.build_timing.outputs.build_seconds }}
        CACHE_HIT: ${{ steps.publish.outputs.cache-hit || steps.restore.outputs.cache-hit }}
        CACHE_IMPORT_READY: ${{ steps.publish.outputs.docker-cache-import-ready || steps.restore.outputs.docker-cache-import-ready }}
        CACHE_IMPORT_REFS: ${{ steps.publish.outputs.docker-cache-from-refs || steps.restore.outputs.docker-cache-from-refs }}
        CACHE_TAG: ${{ steps.publish.outputs.cache-tag || steps.restore.outputs.cache-tag }}
        CACHE_WORKSPACE: ${{ steps.publish.outputs.workspace || steps.restore.outputs.workspace }}
        EVIDENCE_PATH: ${{ steps.publish.outputs.evidence-path || steps.restore.outputs.evidence-path }}
        SOURCE_SHA: ${{ steps.scope.outputs.source_sha }}
      run: |
        set -euo pipefail
        python3 ./scripts/benchmark-report.py phase \
          --benchmark "$BENCHMARK_ID" \
          --strategy "$STRATEGY" \
          --lane fresh \
          --phase "$REPORT_PHASE" \
          --mode docker \
          --restore-or-setup-seconds "$SETUP_SECONDS" \
          --workflow-seconds "$(( $(date +%s) - WORKFLOW_STARTED_AT ))" \
          --build-seconds "$BUILD_SECONDS" \
          --cache-hit "$CACHE_HIT" \
          --cache-import-ready "$CACHE_IMPORT_READY" \
          --cache-import-refs "$CACHE_IMPORT_REFS" \
          --cache-tag "$CACHE_TAG" \
          --workspace "$CACHE_WORKSPACE" \
          --source-repository immich-app/base-images \
          --source-sha "$SOURCE_SHA" \
          --evidence "$EVIDENCE_PATH"

    - name: Retain the benchmark phase evidence
      uses: actions/upload-artifact@v6
      with:
        name: phase-${{ inputs.benchmark_id }}-${{ inputs.strategy }}-${{ inputs.phase }}
        path: benchmark-results/
        if-no-files-found: error
