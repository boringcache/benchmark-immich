workspace = "boringcache/benchmark-immich"

[adapters.docker]
tag = "immich-docker-local"
metadata-hints = ["benchmark=immich-server", "upstream-job=server-amd64"]
command = [
  "docker", "buildx", "build",
  "--file", "upstream/server/Dockerfile",
  "--platform", "linux/amd64",
  "--build-arg", "BUILD_ID=__BUILD_ID__",
  "--build-arg", "BUILD_IMAGE=ghcr.io/immich-app/immich-server:__SOURCE_REF__",
  "--build-arg", "BUILD_SOURCE_REF=__SOURCE_REF__",
  "--build-arg", "BUILD_SOURCE_COMMIT=__SOURCE_SHA__",
  "--build-arg", "DEVICE=cpu",
  "--tag", "immich-server-benchmark:local",
  "upstream",
]

[adapters.ccache]
tag = "immich-ccache-local"
metadata-hints = ["benchmark=immich-base-images", "upstream-job=server-native-amd64"]
